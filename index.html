<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Center Tycoon</title>
    <style>
        :root {
            --bg-dark: #0a0d12;
            --panel-bg: #121820;
            --panel-border: #1f2937;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--panel-border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: bold;
        }

        #main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 2px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 5;
            padding: 15px;
            gap: 12px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 4px;
        }

        .view-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .btn {
            background-color: #1f293d;
            border: 1px solid #374151;
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn:hover {
            background-color: #2d3748;
            border-color: var(--accent-blue);
        }

        .btn.active {
            background-color: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .btn-action {
            background-color: #162436;
            border-color: #2b3e55;
            margin-bottom: 4px;
        }

        .build-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }

        .build-card {
            background: #18202c;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .build-card:hover {
            border-color: var(--accent-blue);
            background: #1e293b;
        }

        .build-card.selected {
            border-color: var(--accent-green);
            background: #142824;
        }

        .build-card-title {
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .build-card-cost {
            color: var(--accent-green);
        }

        .build-card-desc {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .build-card-stats {
            display: flex;
            gap: 8px;
            font-size: 0.68rem;
            margin-top: 4px;
            color: #d1d5db;
        }

        #viewport {
            flex: 1;
            position: relative;
            background-color: #05070a;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #event-log {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 320px;
            max-height: 140px;
            background: rgba(18, 24, 32, 0.85);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(4px);
            border-radius: 4px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            pointer-events: none;
        }

        .log-entry {
            font-size: 0.75rem;
            padding: 4px 6px;
            border-radius: 2px;
            background: rgba(0,0,0,0.3);
            border-left: 3px solid var(--accent-blue);
        }

        .log-entry.alert { border-left-color: var(--accent-red); color: #fca5a5; }
        .log-entry.success { border-left-color: var(--accent-green); }

        .overlay-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(18, 24, 32, 0.9);
            border: 1px solid var(--panel-border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-green);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            width: 480px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-blue);
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .select-input {
            background: #18202c;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            outline: none;
        }

        #tile-tooltip {
            position: absolute;
            display: none;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-blue);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            z-index: 50;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="new-game-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Data Center Tycoon</div>
            <div class="form-group">
                <label>Select Difficulty Multiplier</label>
                <select id="diff-select" class="select-input">
                    <option value="easy">Easy (High Start Capital, Low Base Costs)</option>
                    <option value="normal" selected>Normal (Standard Balance)</option>
                    <option value="hard">Hard (Strict Budget & High Maintenance)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Select Starting Region / Environment</label>
                <select id="region-select" class="select-input">
                    <option value="nordic">Nordic Valley (Cold - Cheap Water Cooling)</option>
                    <option value="desert">Desert Tech Park (Hot - High Cooling Draw)</option>
                    <option value="metro">Metropolitan Hub (High Power Costs, High Client Revenue)</option>
                </select>
            </div>
            <button class="btn" style="background: var(--accent-blue); color: white; padding: 12px;" onclick="startNewGame()">Launch Data Center</button>
        </div>
    </div>

    <div id="header">
        <div class="brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 16V8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8m16 0H4m16 0a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2m4-4h.01M8 12h.01"/></svg>
            DATA CENTER TYCOON
        </div>
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">Capital</span>
                <span class="stat-value" id="val-cash" style="color: var(--accent-green)">$0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Net Monthly</span>
                <span class="stat-value" id="val-net">$0/mo</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Power Supply</span>
                <span class="stat-value" id="val-power">0/0 kW</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Cooling Load</span>
                <span class="stat-value" id="val-cooling">0/0 BTU</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Uptime</span>
                <span class="stat-value" id="val-uptime" style="color: var(--accent-blue)">100%</span>
            </div>
        </div>
    </div>

    <div id="main-container">
        <div id="sidebar">
            <div>
                <div class="section-title">View Mode</div>
                <div class="view-controls">
                    <button class="btn active" id="btn-view-region" onclick="setViewMode('region')">Region</button>
                    <button class="btn" id="btn-view-surface" onclick="setViewMode('surface')">Hall Floor</button>
                    <button class="btn" id="btn-view-utility" onclick="setViewMode('utility')">Sub-Grid</button>
                </div>
            </div>

            <div>
                <div class="section-title">System Controls</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                    <button class="btn btn-action" onclick="saveGame()">Save Game</button>
                    <button class="btn btn-action" onclick="loadGame()">Load Game</button>
                </div>
            </div>

            <div>
                <div class="section-title">Construction & Tools Panel</div>
                <div class="build-grid" id="build-menu"></div>
            </div>
        </div>

        <div id="viewport">
            <canvas id="gameCanvas"></canvas>
            
            <div class="overlay-indicator">
                <div class="indicator-dot" id="view-dot"></div>
                <span id="view-mode-text">Regional Map Overview</span>
            </div>

            <div id="tile-tooltip"></div>

            <div id="event-log">
                <div class="log-entry">Facility initialized. Select tool & drag line to multi-place!</div>
            </div>
        </div>
    </div>

    <script>
        const TILE_WIDTH = 64;
        const TILE_HEIGHT = 32;

        const DIFFICULTY_SETTINGS = {
            easy: { startCash: 150000, maintMult: 0.3, revMult: 1.4 },
            normal: { startCash: 80000, maintMult: 0.5, revMult: 1.0 },
            hard: { startCash: 45000, maintMult: 0.8, revMult: 0.8 }
        };

        const REGION_SETTINGS = {
            nordic: { name: "Nordic Valley", coolingMult: 0.6, powerMult: 1.0 },
            desert: { name: "Desert Tech Park", coolingMult: 1.5, powerMult: 0.9 },
            metro: { name: "Metropolitan Hub", coolingMult: 1.0, powerMult: 1.3 }
        };

        const ITEMS = {
            repair: { id: 'repair', name: 'Repair Tool', cost: 100, category: 'tool', desc: 'Fix damaged or broken components.' },
            upgrade: { id: 'upgrade', name: 'Upgrade Node', cost: 500, category: 'tool', desc: 'Upgrade rack or utility capacity by +50%.' },
            demolish: { id: 'demolish', name: 'Demolish Tile', cost: 10, category: 'tool', desc: 'Clear a tile component.' },
            
            hall_node: { id: 'hall_node', name: 'Construct Server Hall', cost: 15000, category: 'region', desc: 'Builds a new server hall sector.' },
            
            server: { id: 'server', name: 'Standard Server Rack', cost: 800, powerReq: 10, coolingReq: 8, rev: 350, category: 'surface', desc: 'Standard compute rack.' },
            storage: { id: 'storage', name: 'Data Storage Array', cost: 600, powerReq: 5, coolingReq: 4, rev: 220, category: 'surface', desc: 'Low heat capacity revenue.' },
            ml_rack: { id: 'ml_rack', name: 'AI Supercluster', cost: 3200, powerReq: 40, coolingReq: 35, rev: 1400, category: 'surface', desc: 'High density compute module.' },
            ups: { id: 'ups', name: 'UPS Power Unit', cost: 1200, powerReq: -25, coolingReq: 0, rev: 0, category: 'surface', desc: 'Backup utility power module.' },
            
            power_plant: { id: 'power_plant', name: 'Substation Hub', cost: 1500, powerGen: 120, category: 'utility', layer: 'power', desc: 'High-voltage intake node.' },
            power_cable: { id: 'power_cable', name: 'Power Line Conduit', cost: 20, category: 'utility', layer: 'power', desc: 'Routes electrical power under grid.' },
            chiller: { id: 'chiller', name: 'HVAC Chiller Unit', cost: 1800, coolingGen: 100, category: 'utility', layer: 'cooling', desc: 'Refrigerant cooling generator.' },
            cool_pipe: { id: 'cool_pipe', name: 'Cooling Pipe Line', cost: 25, category: 'utility', layer: 'cooling', desc: 'Routes liquid cooling loops.' }
        };

        let state = {
            cash: 0,
            difficulty: 'normal',
            region: 'nordic',
            viewMode: 'region',
            selectedItem: null,
            activeHallIndex: '2_2',
            regionGridSize: 6,
            regionGrid: [],
            hallGridSize: 10,
            hallsData: {},
            powerProduced: 0,
            powerConsumed: 0,
            coolingProduced: 0,
            coolingConsumed: 0,
            netIncome: 0,
            uptime: 100,
            panX: 0,
            panY: 0,
            
            dragStartTile: null,
            hoverTile: null,
            isPanDragging: false,
            panDragStart: { x: 0, y: 0 }
        };

        let canvas, ctx;

        window.onload = () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            setupControls();
            resetCamera();

            requestAnimationFrame(gameLoop);
            setInterval(simulationTick, 2000);
            setInterval(triggerRandomEvents, 12000);
        };

        function resetCamera() {
            state.panX = canvas.width / 2;
            state.panY = state.viewMode === 'region' ? canvas.height / 3 : canvas.height / 4;
        }

        function startNewGame() {
            state.difficulty = document.getElementById('diff-select').value;
            state.region = document.getElementById('region-select').value;
            
            const diffConfig = DIFFICULTY_SETTINGS[state.difficulty];
            state.cash = diffConfig.startCash;

            state.regionGrid = Array(state.regionGridSize).fill(null).map(() => Array(state.regionGridSize).fill(false));
            state.hallsData = {};

            state.regionGrid[2][2] = true;
            initializeHallData(2, 2);
            state.activeHallIndex = '2_2';

            document.getElementById('new-game-modal').style.display = 'none';
            setViewMode('region');
            recalculateInfrastructure();
            logEvent(`Data Center site launched in ${REGION_SETTINGS[state.region].name}. Initial Sector unlocked.`, "success");
        }

        function initializeHallData(rx, ry) {
            const key = `${rx}_${ry}`;
            const size = state.hallGridSize;
            
            state.hallsData[key] = {
                surfaceGrid: Array(size).fill(null).map(() => Array(size).fill(null)),
                utilityGrid: Array(size).fill(null).map(() => Array(size).fill(null).map(() => ({ power: false, cooling: false, nodeType: null, level: 1, damaged: false })))
            };
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        function buildMenuUI() {
            const menu = document.getElementById('build-menu');
            menu.innerHTML = '';

            Object.keys(ITEMS).forEach(key => {
                const item = ITEMS[key];
                
                if (state.viewMode === 'region' && item.category !== 'region' && item.category !== 'tool') return;
                if (state.viewMode === 'surface' && item.category !== 'surface' && item.category !== 'tool') return;
                if (state.viewMode === 'utility' && item.category !== 'utility' && item.category !== 'tool') return;

                const card = document.createElement('div');
                card.className = `build-card ${state.selectedItem === key ? 'selected' : ''}`;
                card.onclick = () => selectTool(key);

                let statsText = '';
                if (item.powerReq) statsText += `⚡ ${item.powerReq}kW `;
                if (item.powerGen) statsText += `⚡ +${item.powerGen}kW `;
                if (item.coolingReq) statsText += `❄️ ${item.coolingReq}BTU `;
                if (item.coolingGen) statsText += `❄️ +${item.coolingGen}BTU `;
                if (item.rev) statsText += `💵 +$${item.rev}/m `;

                card.innerHTML = `
                    <div class="build-card-title">
                        <span>${item.name}</span>
                        <span class="build-card-cost">$${item.cost}</span>
                    </div>
                    <div class="build-card-desc">${item.desc}</div>
                    <div class="build-card-stats">${statsText}</div>
                `;
                menu.appendChild(card);
            });
        }

        function selectTool(key) {
            state.selectedItem = state.selectedItem === key ? null : key;
            buildMenuUI();
        }

        function setViewMode(mode) {
            state.viewMode = mode;
            state.selectedItem = null;
            resetCamera();

            document.getElementById('btn-view-region').className = `btn ${mode === 'region' ? 'active' : ''}`;
            document.getElementById('btn-view-surface').className = `btn ${mode === 'surface' ? 'active' : ''}`;
            document.getElementById('btn-view-utility').className = `btn ${mode === 'utility' ? 'active' : ''}`;
            
            const dot = document.getElementById('view-dot');
            const text = document.getElementById('view-mode-text');
            
            if (mode === 'region') {
                dot.style.backgroundColor = 'var(--accent-purple)';
                text.innerText = 'Regional Facility Planning View';
            } else if (mode === 'surface') {
                dot.style.backgroundColor = 'var(--accent-green)';
                text.innerText = `Hall (${state.activeHallIndex}) Floor Operations`;
            } else {
                dot.style.backgroundColor = 'var(--accent-blue)';
                text.innerText = `Hall (${state.activeHallIndex}) Sub-Grid Utility Pipes`;
            }

            buildMenuUI();
        }

        function logEvent(msg, type = 'info') {
            const log = document.getElementById('event-log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = msg;
            log.prepend(entry);
            if (log.children.length > 8) log.removeChild(log.lastChild);
        }

        function gridToScreen(gx, gy, scaleX = TILE_WIDTH, scaleY = TILE_HEIGHT) {
            const screenX = (gx - gy) * (scaleX / 2) + state.panX;
            const screenY = (gx + gy) * (scaleY / 2) + state.panY;
            return { x: screenX, y: screenY };
        }

        function screenToGrid(sx, sy, scaleX = TILE_WIDTH, scaleY = TILE_HEIGHT) {
            const adjX = sx - state.panX;
            const adjY = sy - state.panY;

            const gx = (adjX / (scaleX / 2) + adjY / (scaleY / 2)) / 2;
            const gy = (adjY / (scaleY / 2) - adjX / (scaleX / 2)) / 2;

            return { x: Math.floor(gx), y: Math.floor(gy) };
        }

        function getLineTiles(start, end) {
            const tiles = [];
            const dx = Math.abs(end.x - start.x);
            const dy = Math.abs(end.y - start.y);
            const sx = start.x < end.x ? 1 : -1;
            const sy = start.y < end.y ? 1 : -1;
            let err = dx - dy;

            let cx = start.x;
            let cy = start.y;

            while (true) {
                tiles.push({ x: cx, y: cy });
                if (cx === end.x && cy === end.y) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; cx += sx; }
                if (e2 < dx) { err += dx; cy += sy; }
            }
            return tiles;
        }

        function setupControls() {
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    const rect = canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const scaleX = state.viewMode === 'region' ? 120 : TILE_WIDTH;
                    const scaleY = state.viewMode === 'region' ? 60 : TILE_HEIGHT;

                    const tile = screenToGrid(mouseX, mouseY, scaleX, scaleY);
                    const maxBound = state.viewMode === 'region' ? state.regionGridSize : state.hallGridSize;

                    if (tile.x >= 0 && tile.x < maxBound && tile.y >= 0 && tile.y < maxBound) {
                        state.dragStartTile = tile;
                    } else {
                        state.isPanDragging = true;
                        state.panDragStart = { x: e.clientX - state.panX, y: e.clientY - state.panY };
                    }
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                if (state.isPanDragging) {
                    state.panX = e.clientX - state.panDragStart.x;
                    state.panY = e.clientY - state.panDragStart.y;
                } else {
                    const scaleX = state.viewMode === 'region' ? 120 : TILE_WIDTH;
                    const scaleY = state.viewMode === 'region' ? 60 : TILE_HEIGHT;
                    const tile = screenToGrid(mouseX, mouseY, scaleX, scaleY);
                    const maxBound = state.viewMode === 'region' ? state.regionGridSize : state.hallGridSize;

                    if (tile.x >= 0 && tile.x < maxBound && tile.y >= 0 && tile.y < maxBound) {
                        state.hoverTile = tile;
                        updateTooltip(e.clientX, e.clientY);
                    } else {
                        state.hoverTile = null;
                        document.getElementById('tile-tooltip').style.display = 'none';
                    }
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (state.dragStartTile && state.hoverTile) {
                    applyMultiPlacement(state.dragStartTile, state.hoverTile);
                }
                state.dragStartTile = null;
                state.isPanDragging = false;
            });
        }

        function updateTooltip(screenX, screenY) {
            const tooltip = document.getElementById('tile-tooltip');
            if (!state.hoverTile) {
                tooltip.style.display = 'none';
                return;
            }

            tooltip.style.display = 'block';
            tooltip.style.left = `${screenX + 15}px`;
            tooltip.style.top = `${screenY + 15}px`;

            const { x, y } = state.hoverTile;

            if (state.viewMode === 'region') {
                const unlocked = state.regionGrid[x] && state.regionGrid[x][y];
                if (unlocked) {
                    tooltip.innerHTML = `<strong>Server Hall (${x}, ${y})</strong><br><span style="color:var(--accent-green)">Click to Enter Sector</span>`;
                } else if (state.selectedItem === 'hall_node') {
                    const cost = ITEMS.hall_node.cost;
                    const affordable = state.cash >= cost;
                    tooltip.innerHTML = `Construct Hall (${x}, ${y})<br>Cost: <span style="color:${affordable ? 'var(--accent-green)' : 'var(--accent-red)'}">$${cost}</span>`;
                } else {
                    tooltip.innerHTML = `Unconstructed Sector (${x}, ${y})`;
                }
                return;
            }

            const hall = state.hallsData[state.activeHallIndex];
            if (!hall) return;

            let lineTiles = [state.hoverTile];
            if (state.dragStartTile && state.selectedItem) {
                lineTiles = getLineTiles(state.dragStartTile, state.hoverTile);
            }

            if (state.selectedItem) {
                const item = ITEMS[state.selectedItem];
                
                // Special Tool: Upgrade preview calculations
                if (item.id === 'upgrade') {
                    const surf = hall.surfaceGrid[x][y];
                    if (surf) {
                        const curLvl = surf.level || 1;
                        const nextLvl = curLvl + 1;
                        const baseItem = ITEMS[surf.type];
                        const cost = item.cost;
                        const affordable = state.cash >= cost;

                        tooltip.innerHTML = `
                            <strong>Upgrade Targeted Rack (${x}, ${y})</strong><br>
                            Type: <strong>${baseItem.name}</strong><br>
                            Level Upgrade: <span style="color:var(--accent-blue)">Lvl ${curLvl} ➔ Lvl ${nextLvl}</span><br>
                            Power Req: ${baseItem.powerReq * curLvl}kW ➔ <strong>${baseItem.powerReq * nextLvl}kW</strong><br>
                            Cooling Load: ${baseItem.coolingReq * curLvl}BTU ➔ <strong>${baseItem.coolingReq * nextLvl}BTU</strong><br>
                            Yield: +$${baseItem.rev * curLvl}/mo ➔ <strong style="color:var(--accent-green)">+$${baseItem.rev * nextLvl}/mo</strong><br>
                            Upgrade Cost: <span style="color:${affordable ? 'var(--accent-green)' : 'var(--accent-red)'}">$${cost}</span>
                        `;
                        return;
                    } else {
                        tooltip.innerHTML = `<strong>Upgrade Tool</strong><br><span style="color:var(--text-muted)">Hover over a rack to preview upgrade stats.</span>`;
                        return;
                    }
                }

                // Special Tool: Repair Preview
                if (item.id === 'repair') {
                    const surf = hall.surfaceGrid[x][y];
                    const util = hall.utilityGrid[x][y];
                    const needsRepair = (surf && surf.damaged) || util.damaged;

                    if (needsRepair) {
                        const affordable = state.cash >= item.cost;
                        tooltip.innerHTML = `
                            <strong style="color:var(--accent-amber)">Repair Target Locked (${x}, ${y})</strong><br>
                            Component: <strong>${surf ? ITEMS[surf.type].name : 'Sub-grid Conduit'}</strong><br>
                            Status: <span style="color:var(--accent-red)">DAMAGED / INOPERATIVE</span><br>
                            Repair Cost: <span style="color:${affordable ? 'var(--accent-green)' : 'var(--accent-red)'}">$${item.cost}</span>
                        `;
                    } else {
                        tooltip.innerHTML = `<strong>Repair Tool Active</strong><br><span style="color:var(--text-muted)">Tile is currently functioning normally.</span>`;
                    }
                    return;
                }

                // Standard Multi-Placement Tracker
                let placeableCount = 0;
                let runningCost = 0;

                lineTiles.forEach(t => {
                    if (runningCost + item.cost <= state.cash) {
                        runningCost += item.cost;
                        placeableCount++;
                    }
                });

                const totalCost = item.cost * lineTiles.length;
                const fullyAffordable = state.cash >= totalCost;

                tooltip.innerHTML = `
                    <strong>${item.name}</strong><br>
                    Selected: <strong>${lineTiles.length} units</strong><br>
                    Cost: <span style="color:${fullyAffordable ? 'var(--accent-green)' : 'var(--accent-red)'}">$${totalCost.toLocaleString()}</span><br>
                    ${!fullyAffordable ? `<span style="color:var(--accent-red)">⚠ Can only afford ${placeableCount} / ${lineTiles.length}</span>` : '<span style="color:var(--accent-green)">✓ Ready to build</span>'}
                `;
            } else {
                const surf = hall.surfaceGrid[x][y];
                const util = hall.utilityGrid[x][y];
                
                let info = `<strong>Tile (${x}, ${y}) Status:</strong><br>`;
                
                if (surf) {
                    info += `• Surface: ${ITEMS[surf.type].name} (Level ${surf.level || 1})<br>`;
                    if (surf.damaged) {
                        info += `<span style="color:var(--accent-red)">⚠ DAMAGED! Select Repair Tool ($${ITEMS.repair.cost})</span><br>`;
                    } else {
                        info += `<span style="color:var(--accent-blue)">💡 Select Upgrade Tool ($${ITEMS.upgrade.cost}) to boost yield</span><br>`;
                    }
                }
                
                if (util.nodeType) {
                    info += `• Sub-Node: ${ITEMS[util.nodeType].name}<br>`;
                    if (util.damaged) info += `<span style="color:var(--accent-red)">⚠ DAMAGED SUB-GRID! Select Repair Tool</span><br>`;
                }
                if (util.power) info += `• ⚡ Conduit Line Connected<br>`;
                if (util.cooling) info += `• ❄️ Liquid Pipe Connected<br>`;

                if (!surf && !util.nodeType && !util.power && !util.cooling) {
                    info += `<span style="color:var(--text-muted)">Empty Plot. Select a tool to build.</span>`;
                }

                tooltip.innerHTML = info;
            }
        }

        function applyMultiPlacement(start, end) {
            if (state.viewMode === 'region') {
                handleTileClick(start.x, start.y);
                return;
            }

            if (!state.selectedItem) {
                if (start.x === end.x && start.y === end.y && state.regionGrid[start.x] && state.regionGrid[start.x][start.y]) {
                    state.activeHallIndex = `${start.x}_${start.y}`;
                    setViewMode('surface');
                }
                return;
            }

            const line = getLineTiles(start, end);
            const item = ITEMS[state.selectedItem];
            const hall = state.hallsData[state.activeHallIndex];
            if (!hall) return;

            let count = 0;

            line.forEach(t => {
                const { x, y } = t;
                if (state.cash < item.cost && item.id !== 'demolish') return;

                if (item.id === 'repair') {
                    const surf = hall.surfaceGrid[x][y];
                    const util = hall.utilityGrid[x][y];
                    if ((surf && surf.damaged) || util.damaged) {
                        state.cash -= item.cost;
                        if (surf) surf.damaged = false;
                        util.damaged = false;
                        count++;
                    }
                } else if (item.id === 'upgrade') {
                    const surf = hall.surfaceGrid[x][y];
                    if (surf) {
                        surf.level = (surf.level || 1) + 1;
                        state.cash -= item.cost;
                        count++;
                    }
                } else if (item.id === 'demolish') {
                    if (state.viewMode === 'surface') hall.surfaceGrid[x][y] = null;
                    else hall.utilityGrid[x][y] = { power: false, cooling: false, nodeType: null, level: 1, damaged: false };
                    count++;
                } else if (item.category === 'surface') {
                    if (!hall.surfaceGrid[x][y]) {
                        hall.surfaceGrid[x][y] = { type: item.id, active: false, level: 1, damaged: false };
                        state.cash -= item.cost;
                        count++;
                    }
                } else if (item.category === 'utility') {
                    const util = hall.utilityGrid[x][y];
                    if (item.layer === 'power') util.power = true;
                    if (item.layer === 'cooling') util.cooling = true;
                    if (item.powerGen || item.coolingGen) util.nodeType = item.id;
                    state.cash -= item.cost;
                    count++;
                }
            });

            if (count > 0) {
                logEvent(`Constructed/Updated ${count}x ${item.name}.`, "success");
            } else if (line.length > 0 && state.cash < item.cost) {
                logEvent(`Insufficient capital to construct requested elements!`, "alert");
            }
            recalculateInfrastructure();
        }

        function handleTileClick(x, y) {
            if (state.viewMode === 'region') {
                if (state.selectedItem === 'hall_node') {
                    if (!state.regionGrid[x][y]) {
                        if (state.cash < ITEMS.hall_node.cost) {
                            logEvent("Not enough money to open a new hall sector!", "alert");
                            return;
                        }
                        state.cash -= ITEMS.hall_node.cost;
                        state.regionGrid[x][y] = true;
                        initializeHallData(x, y);
                        logEvent(`Constructed Server Hall Sector (${x}, ${y}).`, "success");
                    }
                } else {
                    if (state.regionGrid[x][y]) {
                        state.activeHallIndex = `${x}_${y}`;
                        setViewMode('surface');
                        logEvent(`Viewing Server Hall Sector (${x}, ${y}).`, "info");
                    }
                }
                recalculateInfrastructure();
            }
        }

        function recalculateInfrastructure() {
            const diff = DIFFICULTY_SETTINGS[state.difficulty] || DIFFICULTY_SETTINGS.normal;
            const reg = REGION_SETTINGS[state.region] || REGION_SETTINGS.nordic;

            let powerCap = 0;
            let coolingCap = 0;
            let pDraw = 0;
            let cDraw = 0;
            let grossRev = 0;
            let totalRacks = 0;
            let operationalRacks = 0;

            Object.keys(state.hallsData).forEach(key => {
                const hall = state.hallsData[key];
                const size = state.hallGridSize;

                const poweredTiles = Array(size).fill(null).map(() => Array(size).fill(false));
                const cooledTiles = Array(size).fill(null).map(() => Array(size).fill(false));

                const pSources = [], cSources = [];

                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {
                        const util = hall.utilityGrid[x][y];
                        if (!util.damaged) {
                            if (util.nodeType === 'power_plant') {
                                pSources.push({ x, y });
                                powerCap += ITEMS.power_plant.powerGen * (util.level || 1);
                            }
                            if (util.nodeType === 'chiller') {
                                cSources.push({ x, y });
                                coolingCap += ITEMS.chiller.coolingGen * (util.level || 1);
                            }
                        }
                    }
                }

                runBFS(hall.utilityGrid, pSources, poweredTiles, 'power');
                runBFS(hall.utilityGrid, cSources, cooledTiles, 'cooling');

                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {
                        const tile = hall.surfaceGrid[x][y];
                        if (tile && !tile.damaged) {
                            const item = ITEMS[tile.type];
                            const lvl = tile.level || 1;

                            if (item.category === 'surface' && item.id !== 'ups') {
                                totalRacks++;
                                pDraw += (item.powerReq || 0) * lvl;
                                cDraw += (item.coolingReq || 0) * lvl;

                                if (poweredTiles[x][y] && cooledTiles[x][y]) {
                                    tile.active = true;
                                    operationalRacks++;
                                    grossRev += (item.rev || 0) * lvl * diff.revMult;
                                } else {
                                    tile.active = false;
                                }
                            } else if (item.id === 'ups') {
                                powerCap += Math.abs(item.powerReq) * lvl;
                            }
                        }
                    }
                }
            });

            cDraw = Math.round(cDraw * reg.coolingMult);
            pDraw = Math.round(pDraw * reg.powerMult);

            state.powerProduced = powerCap;
            state.powerConsumed = pDraw;
            state.coolingProduced = coolingCap;
            state.coolingConsumed = cDraw;

            let efficiency = 1.0;
            if (pDraw > powerCap) efficiency -= 0.5;
            if (cDraw > coolingCap) efficiency -= 0.4;

            state.uptime = Math.max(0, Math.round((totalRacks > 0 ? (operationalRacks / totalRacks) : 1.0) * efficiency * 100));

            const baseSectorFee = Object.keys(state.hallsData).length * 150;
            const utilityMaintenance = ((pDraw * 0.4) + (cDraw * 0.3)) * diff.maintMult;
            const totalExpense = Math.round(baseSectorFee + utilityMaintenance);

            state.netIncome = Math.round((grossRev * (state.uptime / 100)) - totalExpense);

            document.getElementById('val-cash').innerText = `$${state.cash.toLocaleString()}`;
            document.getElementById('val-net').innerText = `$${state.netIncome}/mo`;
            document.getElementById('val-net').style.color = state.netIncome >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
            
            document.getElementById('val-power').innerText = `${pDraw}/${powerCap} kW`;
            document.getElementById('val-power').style.color = pDraw > powerCap ? 'var(--accent-red)' : 'var(--text-main)';
            
            document.getElementById('val-cooling').innerText = `${cDraw}/${coolingCap} BTU`;
            document.getElementById('val-cooling').style.color = cDraw > coolingCap ? 'var(--accent-red)' : 'var(--text-main)';
            
            document.getElementById('val-uptime').innerText = `${state.uptime}%`;
        }

        function runBFS(grid, sources, resultMatrix, layerType) {
            const queue = [...sources];
            queue.forEach(s => resultMatrix[s.x][s.y] = true);

            while (queue.length > 0) {
                const { x, y } = queue.shift();
                const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];

                dirs.forEach(d => {
                    const nx = x + d.x, ny = y + d.y;
                    if (nx >= 0 && nx < state.hallGridSize && ny >= 0 && ny < state.hallGridSize) {
                        if (!resultMatrix[nx][ny]) {
                            const util = grid[nx][ny];
                            if (!util.damaged && ((layerType === 'power' && util.power) || (layerType === 'cooling' && util.cooling) || util.nodeType)) {
                                resultMatrix[nx][ny] = true;
                                queue.push({ x: nx, y: ny });
                            }
                        }
                    }
                });
            }
        }

        function simulationTick() {
            state.cash += state.netIncome;
            recalculateInfrastructure();
        }

        function triggerRandomEvents() {
            if (Math.random() < 0.25) {
                const eventTypes = ['disaster', 'surge', 'maintenance'];
                const selected = eventTypes[Math.floor(Math.random() * eventTypes.length)];

                const keys = Object.keys(state.hallsData);
                if (keys.length === 0) return;
                const randomHallKey = keys[Math.floor(Math.random() * keys.length)];
                const hall = state.hallsData[randomHallKey];

                const rx = Math.floor(Math.random() * state.hallGridSize);
                const ry = Math.floor(Math.random() * state.hallGridSize);

                if (selected === 'disaster') {
                    if (hall.surfaceGrid[rx][ry]) {
                        hall.surfaceGrid[rx][ry].damaged = true;
                        logEvent(`DISASTER! Electrical Fire damaged rack at sector ${randomHallKey} (${rx}, ${ry})!`, "alert");
                    }
                } else if (selected === 'maintenance') {
                    if (hall.utilityGrid[rx][ry].nodeType) {
                        hall.utilityGrid[rx][ry].damaged = true;
                        logEvent(`PIPE BURST! Sub-utility broken at sector ${randomHallKey} (${rx}, ${ry})! Use Repair Tool!`, "alert");
                    }
                } else {
                    logEvent("Market Surge! High demand boosts computing yield.", "success");
                }
                recalculateInfrastructure();
            }
        }

        function saveGame() {
            try {
                const saveData = JSON.stringify(state);
                localStorage.setItem('dct_savegame', saveData);
                logEvent("Game state successfully saved.", "success");
            } catch (e) {
                logEvent("Failed to save game state.", "alert");
            }
        }

        function loadGame() {
            try {
                const saveData = localStorage.getItem('dct_savegame');
                if (!saveData) {
                    logEvent("No saved game file found!", "alert");
                    return;
                }
                state = JSON.parse(saveData);
                document.getElementById('new-game-modal').style.display = 'none';
                setViewMode(state.viewMode);
                recalculateInfrastructure();
                logEvent("Saved game state loaded successfully.", "success");
            } catch (e) {
                logEvent("Corrupted save file detected.", "alert");
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (state.viewMode === 'region') {
                drawRegionMap();
            } else {
                drawIsometricGrid();
                if (state.viewMode === 'surface') {
                    drawSurfaceLayer();
                } else {
                    drawUtilityLayer();
                }
            }

            drawTargetAndDragHighlights();
            requestAnimationFrame(gameLoop);
        }

        function drawTargetAndDragHighlights() {
            if (state.viewMode === 'region' || !state.hoverTile) return;

            const hall = state.hallsData[state.activeHallIndex];
            if (!hall) return;

            // Multi-placement line preview drag
            if (state.dragStartTile && state.selectedItem) {
                const line = getLineTiles(state.dragStartTile, state.hoverTile);
                const item = ITEMS[state.selectedItem];

                let runningCost = 0;

                line.forEach((t, idx) => {
                    const pos = gridToScreen(t.x, t.y);
                    const isAffordable = (runningCost + item.cost) <= state.cash;
                    if (isAffordable) runningCost += item.cost;

                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                    ctx.lineTo(pos.x, pos.y + TILE_HEIGHT);
                    ctx.lineTo(pos.x - TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                    ctx.closePath();

                    ctx.fillStyle = isAffordable ? 'rgba(16, 185, 129, 0.4)' : 'rgba(239, 68, 68, 0.5)';
                    ctx.fill();
                    ctx.strokeStyle = isAffordable ? '#10b981' : '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    if (idx === line.length - 1) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(`x${line.length} ($${(item.cost * line.length).toLocaleString()})`, pos.x, pos.y - 10);
                    }
                });
                return;
            }

            // Target Hover Highlight System for Repair / Upgrade Tools
            const { x, y } = state.hoverTile;
            const pos = gridToScreen(x, y);

            if (state.selectedItem === 'upgrade') {
                const surf = hall.surfaceGrid[x][y];
                if (surf) {
                    const h = 24 + ((surf.level || 1) - 1) * 6;
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 3;

                    // Isometric selection box wrapper surrounding the 3D rack
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y - h - 4);
                    ctx.lineTo(pos.x + TILE_WIDTH / 2 + 4, pos.y + TILE_HEIGHT / 2 - h);
                    ctx.lineTo(pos.x + TILE_WIDTH / 2 + 4, pos.y + TILE_HEIGHT / 2 + 4);
                    ctx.lineTo(pos.x, pos.y + TILE_HEIGHT + 4);
                    ctx.lineTo(pos.x - TILE_WIDTH / 2 - 4, pos.y + TILE_HEIGHT / 2 + 4);
                    ctx.lineTo(pos.x - TILE_WIDTH / 2 - 4, pos.y + TILE_HEIGHT / 2 - h);
                    ctx.closePath();
                    ctx.stroke();

                    ctx.fillStyle = '#60a5fa';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`UPGRADE ➔ Lvl ${(surf.level || 1) + 1}`, pos.x, pos.y - h - 10);
                }
            } else if (state.selectedItem === 'repair') {
                const surf = hall.surfaceGrid[x][y];
                const util = hall.utilityGrid[x][y];
                const isDamaged = (surf && surf.damaged) || util.damaged;

                if (isDamaged) {
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y - 10);
                    ctx.lineTo(pos.x + TILE_WIDTH / 2 + 4, pos.y + TILE_HEIGHT / 2);
                    ctx.lineTo(pos.x, pos.y + TILE_HEIGHT + 10);
                    ctx.lineTo(pos.x - TILE_WIDTH / 2 - 4, pos.y + TILE_HEIGHT / 2);
                    ctx.closePath();
                    ctx.stroke();

                    ctx.fillStyle = '#f59e0b';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('REPAIR TARGET', pos.x, pos.y - 15);
                }
            }
        }

        function drawRegionMap() {
            const size = state.regionGridSize;
            const scaleX = 120, scaleY = 60;

            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    const pos = gridToScreen(x, y, scaleX, scaleY);
                    const unlocked = state.regionGrid[x] && state.regionGrid[x][y];

                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(pos.x + scaleX / 2, pos.y + scaleY / 2);
                    ctx.lineTo(pos.x, pos.y + scaleY);
                    ctx.lineTo(pos.x - scaleX / 2, pos.y + scaleY / 2);
                    ctx.closePath();

                    ctx.fillStyle = unlocked ? '#1e293b' : '#0d131c';
                    ctx.fill();
                    ctx.strokeStyle = unlocked ? '#3b82f6' : '#243144';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = unlocked ? '#60a5fa' : '#475569';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    
                    if (unlocked) {
                        ctx.fillText(`Server Hall (${x},${y})`, pos.x, pos.y + scaleY / 2 - 2);
                        ctx.fillStyle = '#10b981';
                        ctx.font = '10px sans-serif';
                        ctx.fillText('Active Sector', pos.x, pos.y + scaleY / 2 + 12);
                    } else {
                        ctx.fillText(`Sector (${x},${y})`, pos.x, pos.y + scaleY / 2 + 3);
                    }
                }
            }
        }

        function drawIsometricGrid() {
            for (let x = 0; x < state.hallGridSize; x++) {
                for (let y = 0; y < state.hallGridSize; y++) {
                    const pos = gridToScreen(x, y);
                    
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                    ctx.lineTo(pos.x, pos.y + TILE_HEIGHT);
                    ctx.lineTo(pos.x - TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                    ctx.closePath();

                    ctx.fillStyle = (state.viewMode === 'surface') ? '#111827' : '#090d14';
                    ctx.fill();
                    ctx.strokeStyle = '#1f2937';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        function drawSurfaceLayer() {
            const hall = state.hallsData[state.activeHallIndex];
            if (!hall) return;

            for (let x = 0; x < state.hallGridSize; x++) {
                for (let y = 0; y < state.hallGridSize; y++) {
                    const tile = hall.surfaceGrid[x][y];
                    const pos = gridToScreen(x, y);

                    if (tile) {
                        const h = 24 + ((tile.level || 1) - 1) * 6;
                        let topColor = '#3b82f6', sideColor = '#1d4ed8';

                        if (tile.type === 'storage') { topColor = '#10b981'; sideColor = '#047857'; }
                        if (tile.type === 'ml_rack') { topColor = '#8b5cf6'; sideColor = '#6d28d9'; }
                        if (tile.type === 'ups') { topColor = '#f59e0b'; sideColor = '#b45309'; }

                        if (tile.damaged) {
                            topColor = '#ef4444'; sideColor = '#991b1b';
                        } else if (!tile.active && tile.type !== 'ups') {
                            topColor = '#4b5563'; sideColor = '#1f2937';
                        }

                        ctx.beginPath();
                        ctx.moveTo(pos.x - TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                        ctx.lineTo(pos.x, pos.y + TILE_HEIGHT);
                        ctx.lineTo(pos.x, pos.y + TILE_HEIGHT - h);
                        ctx.lineTo(pos.x - TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2 - h);
                        ctx.fillStyle = sideColor;
                        ctx.fill(); ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(pos.x, pos.y + TILE_HEIGHT);
                        ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                        ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2 - h);
                        ctx.lineTo(pos.x, pos.y + TILE_HEIGHT - h);
                        ctx.fillStyle = '#0f172a';
                        ctx.fill(); ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(pos.x, pos.y - h);
                        ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2 - h);
                        ctx.lineTo(pos.x, pos.y + TILE_HEIGHT - h);
                        ctx.lineTo(pos.x - TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2 - h);
                        ctx.fillStyle = topColor;
                        ctx.fill(); ctx.stroke();
                    }
                }
            }
        }

        function drawUtilityLayer() {
            const hall = state.hallsData[state.activeHallIndex];
            if (!hall) return;

            for (let x = 0; x < state.hallGridSize; x++) {
                for (let y = 0; y < state.hallGridSize; y++) {
                    const util = hall.utilityGrid[x][y];
                    const pos = gridToScreen(x, y);

                    if (util.power) {
                        ctx.beginPath();
                        ctx.strokeStyle = util.damaged ? '#ef4444' : '#f59e0b';
                        ctx.lineWidth = 4;
                        ctx.moveTo(pos.x - 10, pos.y + TILE_HEIGHT / 2);
                        ctx.lineTo(pos.x + 10, pos.y + TILE_HEIGHT / 2);
                        ctx.stroke();
                    }

                    if (util.cooling) {
                        ctx.beginPath();
                        ctx.strokeStyle = util.damaged ? '#ef4444' : '#06b6d4';
                        ctx.lineWidth = 4;
                        ctx.moveTo(pos.x, pos.y + TILE_HEIGHT / 2 - 6);
                        ctx.lineTo(pos.x, pos.y + TILE_HEIGHT / 2 + 6);
                        ctx.stroke();
                    }

                    if (util.nodeType) {
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y + TILE_HEIGHT / 2, 10, 0, Math.PI * 2);
                        ctx.fillStyle = util.damaged ? '#ef4444' : (util.nodeType === 'power_plant' ? '#f59e0b' : '#3b82f6');
                        ctx.fill(); ctx.stroke();
                    }
                }
            }
        }
    </script>
</body>
</html>
